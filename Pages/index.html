<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INWOOD - Landing Page</title>
  <link rel="stylesheet" href="../Style/index.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hero-wrapper">
    <header class="main-header">
      <!-- Logo -->
      <a href="#" class="logo">
        <img src="../assets/images/Logo.svg" alt="INWOOD Logo">
      </a>

      <nav class="nav-menu" id="navMenu">
        <ul>
          <li><a href="#" class="active">Home</a></li>
          <li><a href="#">Products</a></li>
          <li><a href="#">Categories</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </nav>

      <div class="header-actions">
 
        <img src="../assets/images/Icon9.png"
         alt="" class="menu-toggle" id="menuToggle" >
        
        <a href="#" aria-label="Search"><img src="../assets/images/serach.svg" alt="Search"></a>
        <a href="#" aria-label="Cart"><img src="../assets/images/shop.svg" alt="Cart"></a>
        <a href="#" aria-label="Account"><img src="../assets/images/user.svg" alt="Account"></a>
      </div>
    </header>

    <section class="hero-content">
      <div class="hero-text-box">
        <h1 class="hero-title">Exclusive Deals of<br>Furniture Collection</h1>
        <p class="hero-description">Explore different categories. Find the best deals.</p>
        <a href="#" class="btn btn-primary">Shop Now</a>
      </div>
    </section>

  </div>



  <script src="../js/index.js"></script>
</body>
</html>
